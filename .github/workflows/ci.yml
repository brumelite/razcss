name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run checks
        run: npm run check
      - name: Ensure generated files are committed
        run: git diff --exit-code -- dist/reset.css docs/reset.css
      - name: Preview npm package
        run: npm pack --dry-run
